name: NPM Publish Only

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Bump version
        run: |
          # Bump version in source library package.json
          cd projects/ngx-tw
          npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ../..

          # Update root package.json to match
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        id: version

      - name: Rebuild library with new version
        run: npm run build:lib

      - name: Publish to NPM
        run: |
          cd dist/ngx-tw
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Output success
        run: |
          echo "✅ Successfully published ngx-tw@${{ steps.version.outputs.version }} to NPM!"
          echo "🔗 View at: https://www.npmjs.com/package/ngx-tw"
