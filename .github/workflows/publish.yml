name: Publish to NPM

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Bump version and create tag
        id: version
        run: |
          cd dist/ngx-tw
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Determine version bump type based on commit messages
          if git log --format=%s -n 1 | grep -q "feat!:"; then
            VERSION_TYPE="major"
          elif git log --format=%s -n 1 | grep -q "feat:"; then
            VERSION_TYPE="minor"
          else
            VERSION_TYPE="patch"
          fi

          echo "Version bump type: $VERSION_TYPE"

          # Bump version
          npm version $VERSION_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        run: |
          cd dist/ngx-tw
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag and push
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Create Git tag with GitHub CLI (fallback)
        if: failure()
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            --field ref="refs/tags/v${{ steps.version.outputs.version }}" \
            --field sha="${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ steps.version.outputs.version }}',
              name: 'Release v${{ steps.version.outputs.version }}',
              body: `## Changes in v${{ steps.version.outputs.version }}

            ### 🚀 Features
            - See commit history for detailed changes

            ### 🐛 Bug Fixes
            - See commit history for detailed changes

            ### 📦 Installation
            \`\`\`bash
            npm install ngx-tw@${{ steps.version.outputs.version }}
            \`\`\``,
              draft: false,
              prerelease: false
            });
            console.log('Release created:', release.html_url);
