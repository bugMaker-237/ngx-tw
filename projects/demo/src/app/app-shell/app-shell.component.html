<tw-drawer #drawer [sections]="menuSections" [useAsAppShell]="true">
  <div #drawerHeader drawer-header class="flex w-full items-center gap-3">
    <tw-button
      #parentLong
      [twMenuTriggerFor]="menu"
      [class.hidden]="drawer?.isCollapsed"
    >
      <tw-icon svgIcon="hero:bell" [size]="20"></tw-icon> A long button option
    </tw-button>
    <tw-button [twMenuTriggerFor]="menu" [class.hidden]="!drawer?.isCollapsed">
      <tw-icon svgIcon="hero:bell" [size]="20"></tw-icon>
    </tw-button>

    <tw-menu
      #menu
      class="pt-8"
      [panelWidth]="
        !drawer.isCollapsed
          ? drawerHeader.offsetWidth - 24 + 'px!important'
          : '200px'
      "
    >
      <button *twMenuItem>Hello mundo 0</button>
      <button *twMenuItem>Hello mundo 1</button>
      <button *twMenuItem>Hello mundo 2</button>
      <button *twMenuItem>Hello mundo 3</button>
    </tw-menu>
  </div>

  <!-- MainContent -->
  <div class="p-4">
    <div class="flex gap-3">
      <tw-button-icon
        svgIcon="hero:bars-3"
        type="basic"
        color="primary"
        class="md:hidden"
        (click)="drawer.toggleMobileMenu()"
      ></tw-button-icon>
      <h1 class="text-2xl font-bold text-slate-800 mb-4">Dashboard</h1>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
        <h3 class="text-gray-500 text-sm font-medium">Total Sales</h3>
        <p class="text-3xl font-bold text-slate-800 mt-2">$24,500</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
        <h3 class="text-gray-500 text-sm font-medium">Active Users</h3>
        <p class="text-3xl font-bold text-slate-800 mt-2">1,230</p>
      </div>
    </div>
  </div>

  <div drawer-bottom class="flex items-center gap-3">
    <div
      class="h-8 w-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold shrink-0"
    >
      JD
    </div>
    <div class="nav-text">
      <p class="text-sm font-medium">John Doe</p>
      <p class="text-xs text-gray-500">Admin</p>
    </div>
  </div>
</tw-drawer>
