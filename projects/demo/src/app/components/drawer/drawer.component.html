<h2 class="text-2xl font-bold mt-8 mb-4">Drawer Demo</h2>
<div
  #demoContainer
  class="demo-container border border-gray-300 rounded-lg overflow-hidden relative h-[600px]"
>
  <tw-drawer #drawer [sections]="menuSections" title="Demo App">
    <div #drawerHeader drawer-header class="flex w-full items-center gap-3">
      <tw-button
        #parentLong
        [twMenuTriggerFor]="menu"
        [class.hidden]="drawer?.isCollapsed"
      >
        <tw-icon svgIcon="hero:bell" [size]="20"></tw-icon> A long button option
      </tw-button>
      <tw-button
        [twMenuTriggerFor]="menu"
        [class.hidden]="!drawer?.isCollapsed"
      >
        <tw-icon svgIcon="hero:bell" [size]="20"></tw-icon>
      </tw-button>

      <tw-menu
        #menu
        class="pt-8"
        [panelWidth]="!drawer.isCollapsed ? (drawerHeader.offsetWidth - 24) + 'px!important' : '200px'"
      >
        <button *twMenuItem>Hello mundo 0</button>
        <button *twMenuItem>Hello mundo 1</button>
        <button *twMenuItem>Hello mundo 2</button>
        <button *twMenuItem>Hello mundo 3</button>
      </tw-menu>
    </div>

    <div class="p-4">
      <h2 class="text-2xl font-bold mb-4">Content Area</h2>
      <p class="mb-4">
        This is the main content area projected into the drawer.
      </p>
      <p class="text-gray-600">
        Resize the browser window (or container) to see the responsive behavior.
      </p>
      <button
        (click)="drawer.toggleMobileMenu()"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded md:hidden"
      >
        Toggle Mobile Menu
      </button>
    </div>

    <div drawer-bottom class="flex items-center gap-3">
      <div
        class="h-8 w-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-bold shrink-0"
      >
        JD
      </div>
      <div class="nav-text">
        <p class="text-sm font-medium">John Doe</p>
        <p class="text-xs text-gray-500">Admin</p>
      </div>
    </div>
  </tw-drawer>
</div>
