<ng-template #sidebarContent>
  <aside
    class="sidebar-default sidebar-transition fixed md:relative inset-y-0 left-0 z-50 bg-white border-r border-gray-200 flex flex-col w-64 md:w-20 lg:w-64"
    [@drawerAnimation]="isMobile ? drawerAnimationState : null"
    (@drawerAnimation.done)="onAnimationDone($event)"
    [class.-translate-x-full]="isMobile && !isMobileMenuOpen"
    [class.md:translate-x-0]="true"
    [class.w-20-force]="isCollapsed"
    [class.w-64-force]="!isCollapsed && isManuallyToggled"
    [class.is-collapsed]="isCollapsed"
  >
    <!-- Sidebar Header -->
    <div
      class="h-16 flex items-center justify-between px-4 border-b border-gray-100 shrink-0"
    >
      <ng-content select="[drawer-header]"></ng-content>
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden p-1 rounded-full hover:bg-gray-100 text-gray-500"
      >
        <tw-icon [size]="24" [svgIcon]="'hero:x-mark'"> </tw-icon>
      </button>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 py-6 overflow-y-auto overflow-x-hidden">
      @for (section of sections; track section) {
        @if (section.title && !isCollapsed) {
          <div class="mt-8 px-4 mb-2">
            <p
              class="nav-text text-xs font-semibold text-gray-400 uppercase tracking-wider"
            >
              {{ section.title }}
            </p>
          </div>
        }

        <ul class="space-y-1 px-2">
          <ng-container
            *ngTemplateOutlet="menuItems; context: { items: section.items }"
          ></ng-container>
        </ul>
      }
    </nav>

    <!-- Bottom Section -->
    <div
      class="p-4 border-t border-gray-100 flex items-center justify-between shrink-0 relative"
    >
      <div
        class="flex items-center gap-3 overflow-hidden whitespace-nowrap w-full"
      >
        <ng-content select="[drawer-bottom]"></ng-content>
      </div>

      <button
        (click)="toggleSidebarSize()"
        class="desktop-toggle hidden md:flex items-center justify-center w-8 h-8 rounded-full border border-gray-200 text-gray-500 hover:bg-gray-50 hover:text-blue-600 absolute right-[-16px] bottom-20 bg-white shadow-sm z-50"
      >
        <tw-icon
          class="transform transition-transform duration-300"
          [svgIcon]="isCollapsed ? 'hero:chevron-right' : 'hero:chevron-left'"
          [size]="16"
        >
        </tw-icon>
      </button>
    </div>
  </aside>
</ng-template>

<ng-template #menuItems let-items="items">
  @for (item of items; track item.label) {
    <li class="relative">
      <!-- Case 1: Simple Link -->
      @if (!item.children) {
        <a
          [routerLink]="item.route"
          [routerLinkActive]="'bg-primary-50 text-primary-700'"
          [routerLinkActiveOptions]="{ exact: true }"
          [title]="item.label"
          class="flex items-center gap-3 px-3 py-2 rounded-md transition-colors hover:bg-primary-50 hover:text-primary-700 text-slate-600 cursor-pointer"
          [class.gap-3]="!isCollapsed"
          [class.justify-center]="isCollapsed"
        >
          @if (item.icon) {
            <tw-icon [size]="24" [svgIcon]="item.icon"></tw-icon>
          }
          @if (!isCollapsed) {
            <span class="nav-text font-medium text-sm whitespace-nowrap">{{
              item.label
            }}</span>
          }
        </a>
      }

      <!-- Case 2: Submenu -->
      @if (item.children) {
        <ng-container>
          <button
            [title]="item.label"
            (click)="toggleSubmenu(item)"
            class="w-full flex items-center px-3 py-2 rounded-md text-slate-600 hover:bg-primary-50 hover:text-primary-700 cursor-pointer transition-colors group cursor-pointer"
            [class.justify-center]="isCollapsed"
            [class.justify-between]="!isCollapsed"
            [class.bg-primary-50]="hasActiveChild(item.children)"
            [class.text-primary-700]="hasActiveChild(item.children)"
          >
            <div
              class="flex items-center"
              [class.gap-3]="!isCollapsed"
              [class.justify-center]="isCollapsed"
            >
              @if (item.icon) {
                <tw-icon [size]="24" [svgIcon]="item.icon"></tw-icon>
              }

              @if (!isCollapsed) {
                <span class="nav-text font-medium text-sm whitespace-nowrap">{{
                  item.label
                }}</span>
              }
            </div>
            @if (!isCollapsed) {
              <tw-icon
                class="submenu-indicator transition-transform duration-200"
                [svgIcon]="
                  item.expanded ? 'hero:chevron-up' : 'hero:chevron-down'
                "
                [size]="16"
              >
              </tw-icon>
            }
          </button>
          <ul
            class="submenu-container submenu-transition pl-12 pr-2 space-y-1 mt-1"
            [class.submenu-active]="item.expanded"
          >
            <ng-container
              *ngTemplateOutlet="menuItems; context: { items: item.children }"
            ></ng-container>
          </ul>
        </ng-container>
      }
    </li>
  }
</ng-template>

<div class="flex overflow-hidden h-full">
  <!-- Desktop Sidebar Injection -->
  @if (!isMobile) {
    <ng-container [ngTemplateOutlet]="sidebarContent"></ng-container>
  }

  <!-- Main Content -->
  <main
    class="flex-1 overflow-y-auto bg-gray-50"
    [class.h-screen]="useAsAppShell"
  >
    <ng-content></ng-content>
  </main>
</div>
